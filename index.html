<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <title>good.tools</title>
    <meta name="description" content="Free, fast, privacy-focused developer tools that run entirely in your browser." />

    <!-- Apply the saved theme before first paint (see src/stores/theme.store.ts) -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>

    <!-- Runtime config: generated by docker/entrypoint.sh in containers; public/config.js otherwise -->
    <script src="/config.js"></script>
    <script>
      var cfg = window.__RUNTIME_CONFIG__
      if (cfg && cfg.ENABLE_TELEMETRY && cfg.GA_TRACKING_ID) {
        var s = document.createElement('script')
        s.async = true
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + cfg.GA_TRACKING_ID
        document.head.appendChild(s)
        window.dataLayer = window.dataLayer || []
        window.gtag = function () {
          dataLayer.push(arguments)
        }
        gtag('js', new Date())
        gtag('config', cfg.GA_TRACKING_ID, { send_page_view: false })
      }
    </script>
  </head>
  <body>
    <noscript>good.tools needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
