    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-XX2FY53B5V"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-XX2FY53B5V");
    </script>

    <!-- Dark Mode -->
    <script>
      let darkModeMediaQuery = window.matchMedia(
        "(prefers-color-scheme: dark)",
      );

      updateMode();
      darkModeMediaQuery.addEventListener(
        "change",
        updateModeWithoutTransitions,
      );
      window.addEventListener("storage", updateModeWithoutTransitions);

      function updateMode() {
        let isSystemDarkMode = darkModeMediaQuery.matches;
        let isDarkMode =
          window.localStorage.isDarkMode === "true" ||
          (!("isDarkMode" in window.localStorage) && isSystemDarkMode);

        if (isDarkMode) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }

        if (isDarkMode === isSystemDarkMode) {
          delete window.localStorage.isDarkMode;
        }
      }

      function disableTransitionsTemporarily() {
        document.documentElement.classList.add("[&_*]:!transition-none");
        window.setTimeout(() => {
          document.documentElement.classList.remove("[&_*]:!transition-none");
        }, 0);
      }

      function updateModeWithoutTransitions() {
        disableTransitionsTemporarily();
        updateMode();
      }
    </script>
  </head>
  <body class="bg-white antialiased dark:bg-zinc-900">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
