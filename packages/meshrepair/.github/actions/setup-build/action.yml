name: Setup Build Environment
description: Sets up the build environment with Emscripten, Node.js, and build tools

inputs:
  registry-url:
    description: 'npm registry URL (only for publishing)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 4.0.23

    - name: Install build tools
      shell: bash
      run: |
        sudo apt-get -qq -y update && sudo DEBIAN_FRONTEND="noninteractive" apt-get install -y --no-install-recommends \
          ninja-build \
          python3-pip \
          curl \
          xz-utils
        pip3 install meson

    - name: Configure Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        registry-url: ${{ inputs.registry-url }}

    - name: Cache lib dependencies
      uses: actions/cache@v4
      with:
        path: |
          built/*
          !built/bin/meshrepair.js
          !built/bin/meshrepair.wasm
          lib/*
          !lib/meshrepair
          !lib/crossfile.meson
          !lib/Makefile
        key: lib-${{ hashFiles('lib/Makefile', 'lib/crossfile.meson', 'lib/meshrepair/**') }}

    - name: Build WASM lib
      shell: bash
      run: npm run build:emscripten-local

    - name: Load Dependencies
      shell: bash
      run: npm ci
