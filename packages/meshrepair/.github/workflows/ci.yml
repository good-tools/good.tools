name: Build & Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    if: |
      !contains(github.event.head_commit.message, 'skip-ci')

    steps:
    - uses: actions/checkout@v3

    - name: Setup emsdk
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 4.0.23

    - name: Verify EMSDK
      run: emcc -v

    - name: Install build tools
      run: |
        sudo apt-get -qq -y update && sudo DEBIAN_FRONTEND="noninteractive" apt-get install -y --no-install-recommends \
          ninja-build \
          python3-pip \
          curl \
          xz-utils
        pip3 install meson

    - name: Configure Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - uses: actions/cache@v3
      with:
        path: |
          built/*
          !built/bin/trigasm.js
          !built/bin/trigasm.wasm
          lib/*
          !lib/trigasm
          !lib/crossfile.meson
          !lib/Makefile
        key: lib-${{ hashFiles('lib/Makefile', 'lib/crossfile.meson', 'lib/trigasm/**') }}

    - name: Build WASM lib
      run: npm run build:emscripten-local

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lib
        path: |
          built/bin/trigasm.*

    - name: Load Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test
