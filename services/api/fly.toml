# api.good.tools — deploy with: flyctl deploy --config services/api/fly.toml
app = "good-tools-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CORS_ORIGINS = "https://good.tools,http://localhost:3000"
  TRUST_PROXY = "fly"
  # Sized for a shared-cpu-1x@256MB machine with a 1 GB volume
  GOMEMLIMIT = "200MiB"
  IMAGE_MAX_SIZE = "419430400"   # 400 MiB compressed per image
  IMAGE_CACHE_SIZE = "629145600" # 600 MiB of cached layers (the GeoIP databases need ~280 MiB more while refreshing)

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: the proxy starts the machine on the next request. "suspend" snapshots memory,
  # so resuming takes a few hundred ms and keeps the GeoIP reader and image indexes warm.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# No volume: /data (image cache, GeoIP databases) lives on the machine's root filesystem (~8 GB,
# reset on restart/deploy, kept across suspend). It's all re-creatable.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
