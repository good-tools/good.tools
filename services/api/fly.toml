# api.good.tools — deploy with: flyctl deploy --config services/api/fly.toml
app = "good-tools-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CORS_ORIGINS = "https://good.tools"
  TRUST_PROXY = "fly"
  IMAGE_MAX_SIZE = "2147483648"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[mounts]
  source = "api_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
