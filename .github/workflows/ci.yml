name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Optional Turborepo remote cache: with these set, CI shares task outputs with developers
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # services/api is built and tested through turbo, so Go must be available here too
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      # Upstream sources pinned by wasmpatch (e.g. VCGlib), keyed on the pins
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/.cache/tarballs
          key: wasmpatch-tarballs-${{ hashFiles('packages/*/upstream.json') }}
      - run: bun install --frozen-lockfile
      # Build first so the WebAssembly packages' tests run against real binaries. Turborepo
      # skips anything whose inputs are unchanged; native code is only compiled (in the pinned
      # emsdk Docker image) when its inputs changed.
      - run: bun run build
      - run: bun run check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref != 'refs/heads/master'
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 1

  # Branch preview on Cloudflare: a Worker version under a per-branch alias, which doesn't touch
  # production. Pushes in forks have no secrets, so they skip it.
  preview:
    needs: test
    if: github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comment the preview URL
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: apps/web/dist

      # pr-<n> aliases are served on pr-<n>.good.tools (apps/web/preview-router); a branch without
      # an open PR gets a branch-named alias on workers.dev only
      - name: Upload the preview
        id: upload
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            alias="pr-$pr"
          else
            alias=$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9' '-' | sed 's/--*/-/g; s/^-//' | cut -c1-40 | sed 's/-$//')
          fi
          out=$(npx --yes wrangler@4.147.0 versions upload --preview-alias "$alias" --message "$BRANCH@${GITHUB_SHA::7}")
          echo "$out"
          url=$(grep -oE 'Alias URL: https://[^ ]+' <<< "$out" | cut -d' ' -f3)
          [ -n "$pr" ] && url="https://pr-$pr.good.tools"
          echo "Preview: $url"
          { echo "pr=$pr"; echo "url=$url"; } >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        if: steps.upload.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.upload.outputs.pr }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          # The marker must be on its own line: GitHub renders a line that starts with HTML as raw HTML
          body=$(printf '**Preview:** [%s](%s) for `%s`\n\n<!-- preview -->' "${URL#https://}" "$URL" "${GITHUB_SHA::7}")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[] | select(.body | contains("<!-- preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$body"
          fi

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: services/api
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
