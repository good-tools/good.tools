name: Test

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Optional Turborepo remote cache (e.g. Vercel Remote Cache): with these set, CI shares
      # task outputs with developers. Compiled WebAssembly reaches Vercel previews through the
      # published prebuilt binaries instead (see packages/meshrepair/scripts/build-wasm.mjs).
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # services/api is built and tested through turbo, so Go must be available here too
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      # Upstream sources pinned by wasmpatch (e.g. VCGlib), keyed on the pins
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/*/.cache/tarballs
          key: wasmpatch-tarballs-${{ hashFiles('packages/*/upstream.json') }}
      - run: bun install --frozen-lockfile
      # Build first so the WebAssembly packages' tests run against real binaries. Turborepo
      # skips anything whose inputs are unchanged; native code is only compiled (in the pinned
      # emsdk Docker image) when its inputs changed.
      - run: bun run build
      - run: bun run check

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: services/api
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
