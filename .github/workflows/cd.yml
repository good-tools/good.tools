name: Release & Deploy

# Runs after Test succeeds on a push to master. release-please keeps a
# release PR open with the next version and changelog; merging it creates
# the release, and the deploy job builds that commit and ships it to S3 +
# CloudFront.
on:
  workflow_run:
    workflows: [Test]
    branches: [master]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository == 'good-tools/good.tools' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # release-please always acts on the current master tip, so only run it
      # for the Test run of that tip.
      - name: Check run is for master tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: run is for $HEAD_SHA, master is at $tip"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.tip.outputs.latest == 'true'
        with:
          # PAT so the release PR triggers Test (GITHUB_TOKEN events don't).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the release asset
    steps:
      - name: Check release commit matches the Test run
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$RELEASE_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Release commit $RELEASE_SHA != Test run commit $HEAD_SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build-sitemap
      - run: npm run build

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf dist.tar.gz dist/
          gh release upload "${{ needs.release-please.outputs.tag_name }}" dist.tar.gz --clobber

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@13d241b293754004c80624b5567555c4a39ffbe3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy
        run: aws s3 sync ./dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*"
