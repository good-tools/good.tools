name: Release & Deploy

on:
  workflow_run:
    workflows: [Test]
    branches: master
    types: completed

permissions:
  contents: write # semantic-release: tag, release, changelog commit
  packages: write # push the Docker image to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository == 'good-tools/good.tools' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # semantic-release bumps the version, then rebuilds (see release.config.cjs) so the
      # deployed bundle shows the released version
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release

      - name: Read released version
        if: steps.release.outputs.released == '1'
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        if: steps.release.outputs.released == '1'
      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.released == '1'
      - uses: docker/login-action@v3
        if: steps.release.outputs.released == '1'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: steps.release.outputs.released == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        if: steps.release.outputs.released == '1'
        uses: aws-actions/configure-aws-credentials@13d241b293754004c80624b5567555c4a39ffbe3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy
        if: steps.release.outputs.released == '1'
        run: aws s3 sync ./dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: CF Invalidation
        if: steps.release.outputs.released == '1'
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths "/*"
