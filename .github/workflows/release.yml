name: Release & Deploy

# Runs after Test succeeds on a push to master. release-please keeps a
# release PR open with the next versions and changelogs; merging it creates
# the releases. Then:
# - build → site, image (when apps/web was released): deploys the static site
#   to Cloudflare and publishes the Docker image to ghcr.io, independently
# - api: deploys services/api to Fly.io (when it was released)
# - publish-npm: publishes every released npm package (packages/*, tools/*)
#   with npm trusted publishing. npmjs.com trusts *this* workflow file
#   (release.yml), so keep the name.
on:
  workflow_run:
    workflows: [Test]
    branches: [master]
    types: [completed]
  # Recovery / manual redeploy of an existing release (e.g. if release-please
  # created the release but the run failed before deploying it).
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy (e.g. good.tools-v1.28.0)
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.repository == 'good-tools/good.tools' }}
    outputs:
      release_created: ${{ steps.release.outputs['apps/web--release_created'] }}
      tag_name: ${{ steps.release.outputs['apps/web--tag_name'] }}
      sha: ${{ steps.release.outputs['apps/web--sha'] }}
      api_release_created: ${{ steps.release.outputs['services/api--release_created'] }}
      npm_paths: ${{ steps.npm.outputs.paths }}
    steps:
      # release-please always acts on the current master tip, so only run it
      # for the Test run of that tip.
      - name: Check run is for master tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq .sha)
          if [ "$tip" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping: run is for $HEAD_SHA, master is at $tip"
          fi

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: steps.tip.outputs.latest == 'true'
        with:
          # PAT so the release PR triggers Test (GITHUB_TOKEN events don't).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Released npm packages
        id: npm
        if: steps.tip.outputs.latest == 'true'
        env:
          RELEASED: ${{ steps.release.outputs.paths_released || '[]' }}
        run: echo "paths=$(jq -c '[.[] | select(startswith("packages/") or startswith("tools/"))]' <<< "$RELEASED")" >> "$GITHUB_OUTPUT"

  # Builds once for the site and the image, which then deploy independently.
  build:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check the release exists
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null

      - name: Check release commit matches the Test run
        if: github.event_name != 'workflow_dispatch'
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$RELEASE_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Release commit $RELEASE_SHA != Test run commit $HEAD_SHA"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build # also generates sitemap.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          retention-days: 1
          path: |
            apps/web/dist
            packages/meshrepair/wasm

  # The static site on Cloudflare (apps/web/wrangler.jsonc)
  site:
    needs: [release-please, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload the release asset, mark the release as latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build

      - name: Deploy to Cloudflare
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.147.0 deploy

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf dist.tar.gz -C apps/web dist/
          gh release upload "$TAG" dist.tar.gz --clobber -R "$GITHUB_REPOSITORY"

      # Package releases (api-v*, jdserialize-v*, ...) are created after the web one and would
      # otherwise take GitHub's "Latest" badge. A manual redeploy of an older release leaves it.
      - name: Mark the web release as latest
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --latest -R "$GITHUB_REPOSITORY"

  # ghcr.io/good-tools/good.tools: the web app and the API in one image
  image:
    needs: [release-please, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build

      # No QEMU: every stage that runs commands builds on the runner's platform and cross-compiles
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          IS_NEW_RELEASE: ${{ github.event_name != 'workflow_dispatch' }}
        # Tags are good.tools-vX.Y.Z (older ones vX.Y.Z); the image tag is the bare version
        run: |
          {
            echo "version=${TAG##*v}"
            echo "tags<<EOF"
            echo "$IMAGE:${TAG##*v}"
            # a manual redeploy of an older release must not move :latest
            if [ "$IS_NEW_RELEASE" = "true" ]; then echo "$IMAGE:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          # the WebAssembly from the build job (no Docker inside the image build)
          build-contexts: |
            wasm-meshrepair=packages/meshrepair/wasm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.licenses=MIT

  # api.good.tools on Fly.io, when services/api was released
  api:
    needs: release-please
    if: ${{ needs.release-please.outputs.api_release_created == 'true' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # v1.5
      - name: Deploy
        working-directory: services/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false

  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.npm_paths != '' && needs.release-please.outputs.npm_paths != '[]' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.npm_paths) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@^11.5.1
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=./${{ matrix.path }}
      - name: Pack and publish
        working-directory: ${{ matrix.path }}
        run: |
          # bun pm pack resolves workspace:* ranges to real versions
          bun pm pack --destination "$RUNNER_TEMP/pkg"
          npm publish "$RUNNER_TEMP"/pkg/*.tgz --access public --provenance
