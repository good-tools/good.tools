name: PR Title

# Squash merges use the PR title as the commit message, and release-please
# derives versions and the changelog from it, so it must be a Conventional Commit.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

# One run per PR at a time; release-please pushes and then edits its PR in quick succession
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    # `edited` also fires for body and base changes; only a title change needs a recheck
    if: github.event.action != 'edited' || github.event.changes.title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
